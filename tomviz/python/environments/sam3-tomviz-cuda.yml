# Conda environment for the Tomviz "SAM 3 Segmentation (3D)" operator.
# Requires an NVIDIA GPU: SAM 3 inference in this operator is CUDA-only,
# so this environment is intended for Linux machines with CUDA.
#
# Create with:  conda env create -f sam3-tomviz-cuda.yml
# Then select this environment in the operator's Execution tab.
#
# The model checkpoint (sam3.pt, ~3.5 GB) is downloaded separately from
# https://huggingface.co/facebook/sam3 (requires accepting Meta's SAM
# License) into ~/.tomviz/sam3/checkpoints/.
name: sam3-tomviz
channels:
  # label/beta is needed while Tomviz 3.0 is in beta; remove at release.
  - conda-forge/label/beta
  - conda-forge
dependencies:
  - python=3.13
  # NOTE: pin exactly while Tomviz 3.0 is in beta; relax to >=3.0 at release.
  - tomviz-pipeline=3.0.0beta1
  - sam3=0.1.0.20260515
  - pytorch=*=cuda*
  - numpy
  - scipy
  - pillow
